name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease assembleDebug

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-mic-apks
        path: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Android MIC v1.0.${{ github.run_number }}
        body: |
          ### 🎉 Android MIC Application Latest Release
          - **Production Release APK**: `app-release.apk` (Signed & Optimized)
          - **Debug APK**: `app-debug.apk`
          - **Changelog**: Fixed Bluetooth microphone capture, added multi-rate upsampler, and communication mode routing.
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
